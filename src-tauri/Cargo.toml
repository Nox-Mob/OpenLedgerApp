[package]
name = "openledgerapp"
version = "0.1.0"
description = "OpenLedgerApp desktop edition"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2.5.0", features = ["sqlite"] }
# Same sqlx the SQL plugin uses; needed to open the single-connection pool (see src/lib.rs).
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }
