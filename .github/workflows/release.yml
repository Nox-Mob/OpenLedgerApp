# Production release (docs/SHARED-SPEC.md §10.2). Owner-triggered only.
# Applies this repo's migrations to production (no seed), then deploys the Worker to
# ledger.openapphub.org. If migrations fail, nothing is deployed.
# Follow docs/release-checklist.md first; agents never run this workflow.
name: Release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "ledger.openapphub.org" to migrate and deploy production'
        required: true

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    name: Migrate and deploy production
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/main'
    env:
      HAS_DB: ${{ secrets.PROD_DATABASE_URL != '' }}
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Confirm target
        if: inputs.confirm != 'ledger.openapphub.org'
        run: |
          echo "::error::Confirmation didn't match. Type ledger.openapphub.org to release."
          exit 1
      - uses: actions/checkout@v4
      - name: Preflight (fails instead of skipping)
        run: bash scripts/deploy/preflight.sh production
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build for production
        # Before migrating, so a broken build never leaves the database ahead of the code.
        run: |
          node scripts/deploy/build-env.mjs production >> "$GITHUB_ENV"
          npm run build
      - name: Migrate production (no seed)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: node scripts/migrate.mjs
      - name: Deploy Worker (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.151.2 deploy --config wrangler.jsonc --env production
