# OpenLedgerApp CI — validates only. It never auto-fixes, formats, commits or pushes,
# so forks and copies of this repo get an honest report, not silent changes.
# Every failing job writes the reason to the run summary and as inline annotations.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call: # the desktop release reuses every check below before it builds
  schedule:
    - cron: "0 7 * * 1" # weekly run catches newly published dependency vulnerabilities

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (money, reports, dates, imports, permissions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Vendored shared code matches OpenAppHub
        run: node scripts/check-shared.mjs
      - name: Env files untracked and free of private values
        # Only .env.example (placeholders) and .env.desktop (public build flag) may be tracked.
        run: node scripts/ci/check-env.mjs
      - name: Direct database writes (server functions must use shared code)
        # Tracked on its own so a new direct write shows up as a named failure.
        # Fix by moving the write into a service or audited_write; only cloud-only
        # records may carry a `// cloud-only-write: <reason>` comment.
        run: |
          npx vitest run src/lib/direct-writes.test.ts src/lib/architecture.test.ts --reporter=default --reporter=github-actions || {
            echo "### ❌ A server function writes to the database directly. Move it into shared code (see src/lib/direct-writes.test.ts)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
      - name: Run tests
        run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=test-results.xml --reporter=github-actions
      - name: Report failures
        if: failure()
        run: echo "### ❌ Unit tests failed — see the annotations above for which rule broke and why. The build was blocked." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with: { name: unit-test-results, path: test-results.xml }

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: tsc --noEmit
        run: |
          npx tsc --noEmit --pretty false 2>&1 | tee tsc.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            echo "### ❌ Type errors (build blocked)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"; head -50 tsc.log >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: [unit-tests, typecheck]
    env:
      VITE_SUPABASE_URL: https://ci.invalid
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      VITE_SUPABASE_PROJECT_ID: ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: vite build
        run: |
          npm run build 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            echo "### ❌ Build failed" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"; grep -iE "error|failed" build.log | head -30 >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code

  database:
    name: Database rules (migrations, tenant isolation, ledger invariants, roles)
    runs-on: ubuntu-latest
    # Builds a throwaway database the way production is built (scripts/migrate.mjs: the
    # OpenAppHub core, then db/migrations) on Postgres with a stub of Supabase's auth,
    # then runs db/tests/*.sql. Mirrors OpenCharterApp's "Database rules" job.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Static migration checks (schema, GRANTs, row level security, no data loss)
        run: node scripts/ci/check-migrations.mjs
      - name: Apply migrations and run the SQL safety checks
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          bash scripts/db/test.sh || {
            echo "### ❌ A database rule failed (isolation, ledger invariants, roles, two-step sign-in or read-only)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

  performance:
    # One set of books grown to 5,000, 20,000 and 50,000 transactions next to 30 other
    # organizations; fails if a heavy report is over budget at any size. The budget is
    # looser than the 1 second target because shared runners are slower and vary.
    # Mirrors OpenCharterApp's Performance job.
    name: Performance (5,000 to 50,000 transactions)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Seed large books and time the heavy reports
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          PERF_BUDGET_MS: "3000"
        run: |
          bash scripts/db/perf.sh || {
            echo "### ❌ A heavy report went over budget, or the security catalogue check failed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

  lint:
    name: Lint (code problems — blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: eslint
        run: |
          npx eslint . --format stylish 2>&1 | tee lint.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            echo "### ❌ Lint errors (real code problems, build blocked)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"; grep -E "error" lint.log | head -40 >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code

  format:
    name: Formatting
    runs-on: ubuntu-latest
    # Whitespace/style only. Reported, never auto-applied; run `npm run format` locally to fix.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check || (echo "### ⚠️ Files not formatted — run \`npm run format\` locally (blocks the build)" >> "$GITHUB_STEP_SUMMARY"; exit 1)

  dependency-audit:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit (fails on high/critical)
        # Audits packages shipped with the app (dev-only tooling such as eslint is skipped).
        run: |
          npm audit --omit=dev --audit-level=high 2>&1 | tee audit.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            echo "### ❌ High/critical vulnerable packages found — update them manually" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"; head -40 audit.log >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code
      - name: Full audit including developer tools (report only)
        continue-on-error: true
        run: |
          npm audit 2>&1 | tee audit-dev.log || {
            echo "### ⚠️ Developer-tool vulnerabilities (not blocking)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"; head -40 audit-dev.log >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          }
