# H-06: generated database types. Builds a database from the migrations, regenerates
# src/integrations/supabase/types.ts with the Supabase CLI, and opens a pull request into staging
# when it changed. Runs when migrations change on staging, or by hand (Actions > Generated types).
name: Generated types

on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths: ["db/**"]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gen-types
  cancel-in-progress: true

jobs:
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Install psql
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Generate types from the migrations
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: bash scripts/db/gen-types.sh
      - name: Open a pull request when they changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- src/integrations/supabase/types.ts; then
            echo "Types are up to date."
            exit 0
          fi
          branch="chore/generated-types-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add src/integrations/supabase/types.ts
          git commit -m "chore: regenerate database types (H-06)"
          git push origin "$branch"
          gh pr create --base staging --head "$branch" --title "chore: regenerate database types" \
            --body "Generated by the Generated types workflow from the migrations on ${{ github.ref_name }} (H-06). Review the diff, then merge."
