name: End-to-end

# Playwright against a local dev server running self-hosted (its own sign-in page) on STAGING,
# signed in as the suite demo accounts (OpenAppHub's demo, reset every 12 hours). Settings come
# from wrangler.jsonc env.staging; no secrets. Google Chrome stable, sandbox on (as in
# OpenCharterApp). Daily as well, to catch staging changes made outside this repository.
on:
  push:
    branches: [staging]
  pull_request:
    branches: [main, staging]
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      # GitHub's Ubuntu runners ship Google Chrome stable; install it (and its system packages
      # through apt) only when it's missing, so an apt mirror outage doesn't fail the run.
      - name: Google Chrome
        run: command -v google-chrome || npx playwright install --with-deps chrome
      - name: Run end-to-end tests
        run: npm run test:e2e
        env:
          CI: "true"
          E2E_BROWSER_CHANNEL: chrome
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
