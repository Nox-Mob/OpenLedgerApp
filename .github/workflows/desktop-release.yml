# Desktop release: runs only on main. Every CI check must pass first; then, if the
# package.json version has no release yet, builds Linux, macOS and Windows installers
# and attaches them to a DRAFT GitHub release (tag vX.Y.Z) for manual testing.
name: Desktop release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: All CI checks
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  install-check:
    name: Desktop install check
    needs: checks
    uses: ./.github/workflows/desktop-check.yml

  version:
    name: Is this version new?
    needs: [checks, install-check]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_new: ${{ steps.v.outputs.is_new }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0 }
      - id: v
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
            echo "### v$version already released, no desktop build" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: version
    if: needs.version.outputs.is_new == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, platform: ubuntu-22.04, args: "" }
          - { name: Windows, platform: windows-latest, args: "" }
          - {
              name: macOS (Apple Silicon),
              platform: macos-latest,
              args: "--target aarch64-apple-darwin",
            }
          - { name: macOS (Intel), platform: macos-latest, args: "--target x86_64-apple-darwin" }
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - name: Linux system libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { workspaces: "./src-tauri -> target" }
      - run: npm ci
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ needs.version.outputs.version }}
          releaseName: OpenLedgerApp v${{ needs.version.outputs.version }}
          releaseBody: "Draft desktop build. Test each installer, add release notes from CHANGELOG.md, then publish. macOS builds are unsigned."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
